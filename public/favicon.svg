<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Balloon Left Emerald Stripe -->
    <linearGradient id="emeraldStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Balloon Center Cyan Stripe -->
    <linearGradient id="cyanStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Balloon Right Magenta Stripe -->
    <linearGradient id="magentaStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gold Basket Gradient -->
    <linearGradient id="goldBasket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern App Squircle Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGlow)" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Subtle Radial Backlight -->
  <circle cx="256" cy="230" r="160" fill="#3b82f6" opacity="0.15" />

  <!-- Hot Air Balloon Vector -->
  <g transform="translate(0, -10)">
    <!-- Center Cyan Stripe -->
    <path d="M226 90 C240 85 272 85 286 90 L274 330 C265 334 247 334 238 330 Z" fill="url(#cyanStripe)" />

    <!-- Left Emerald Stripe -->
    <path d="M226 90 C160 100 130 160 130 220 C130 280 180 320 238 330 L226 90 Z" fill="url(#emeraldStripe)" />

    <!-- Right Magenta Stripe -->
    <path d="M286 90 C352 100 382 160 382 220 C382 280 332 320 274 330 L286 90 Z" fill="url(#magentaStripe)" />

    <!-- Highlight Glass Gloss Curve -->
    <path d="M155 180 C155 130 190 105 230 95 C205 110 175 145 175 195 C175 240 195 275 220 295 C185 275 155 235 155 180 Z" fill="#ffffff" opacity="0.3" />

    <!-- Burner Rigging Cables -->
    <line x1="220" y1="340" x2="236" y2="375" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="292" y1="340" x2="276" y2="375" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Woven Metallic Basket -->
    <rect x="230" y="375" width="52" height="38" rx="8" fill="url(#goldBasket)" stroke="#78350f" stroke-width="3" />
    <line x1="234" y1="388" x2="278" y2="388" stroke="#78350f" stroke-width="2" />
    <line x1="234" y1="400" x2="278" y2="400" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Precision Vector Pen Nib & Anchor Nodes in Foreground -->
  <g transform="translate(340, 340)">
    <!-- Glowing Pen Nib Badge -->
    <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <!-- Pen Nib Icon -->
    <path d="M42 22 L58 22 L66 48 L50 68 L34 48 Z" fill="#38bdf8" />
    <circle cx="50" cy="46" r="4" fill="#0f172a" />
    <line x1="50" y1="50" x2="50" y2="68" stroke="#0f172a" stroke-width="2" />
  </g>
</svg>